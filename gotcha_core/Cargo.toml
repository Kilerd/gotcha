[package]
name = "gotcha_core"
description = "Lightweight schema core (Schematic trait + data-type impls) for the Gotcha web framework"
edition = "2021"
version = "0.4.1"
license = "MIT"
repository = "https://github.com/Kilerd/gotcha/"

# docs.rs builds with every feature, so the OpenAPI layer and the rest of the optional surface
# actually appear; `docsrs` turns on the per-item "requires feature X" badges.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
doctest = true

[features]
# `Schematic` implementations for common third-party data types. All are on by default, so a
# plain `gotcha_core` dependency documents them as before; a crate that never uses one can turn
# it off with `default-features = false` and its own feature list.
default = ["bigdecimal", "chrono", "rust_decimal", "uuid"]
bigdecimal = ["dep:bigdecimal"]
chrono = ["dep:chrono"]
rust_decimal = ["dep:rust_decimal"]
uuid = ["dep:uuid"]
# Enables the axum-facing schema glue: `Responsible for Json<T>` and the whole
# `ParameterProvider` family (impls for Path/Json/Query/Form/State/Extension/Request/Multipart/
# WebSocketUpgrade). Off by default so a crate that only needs the Schematic schema layer stays
# free of axum/regex/either. The `gotcha` crate turns this on.
axum = ["dep:axum", "dep:axum-extra", "dep:regex", "dep:either"]

[dependencies]
gotcha_macro = { version = "0.4.1", path = "../gotcha_macro" }
oas = "0.3"
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "multipart", "ws"], optional = true }
# `TypedHeader<T>` lives here since axum 0.7; the impl must be in this crate because that is where
# `ParameterProvider` is defined (orphan rule).
axum-extra = { version = "0.10", default-features = false, features = ["typed-header"], optional = true }
regex = { version = "1", optional = true }
either = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bigdecimal = { version = "0.4", optional = true }
chrono = { version = "0.4", optional = true }
uuid = { version = "1.10", optional = true }
rust_decimal = { version = "1.36", optional = true }

tracing = "0.1"
convert_case = "0.6"
