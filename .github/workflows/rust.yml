name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  # Keep line tables for backtraces but drop full debug info, which is most of a test target
  # directory. Without this the all-features job ran the runner out of disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:

  define-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.features.outputs.matrix }}

    steps:
      - uses: actions/checkout@v3
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Define Features
        id: features
        run: |
          python3 test-feature-matrix.py echo >> "$GITHUB_OUTPUT"

  gotcha-test:
    name: gotcha-test (${{ matrix.case.key }})
    runs-on: ubuntu-latest
    needs: define-matrix
    strategy:
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v3

      - name: Free disk space
        # The all-features job (trybuild fixtures, jsonschema, data-type crates) has filled the
        # runner's disk; none of these preinstalled toolchains are used here.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Matrix jobs share a job id, but compile different dependency features.
          key: ${{ matrix.case.key }}

      - name: Run tests
        run: cargo test --package gotcha ${{ matrix.case.args }}

      - name: Prepare trybuild cache cleanup
        # rust-cache probes both test target directories without awaiting errors.
        # Remove this workaround once https://github.com/Swatinem/rust-cache/pull/387 ships.
        run: |
          if [ -d target/tests/trybuild ]; then
            mkdir -p target/tests/target
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Test standalone consumers
        run: python3 test-downstream.py

      - name: Test without default features
        run: cargo test -p gotcha --no-default-features

      - name: Run tests (gotcha_macro)
        run: |
          cargo test -p gotcha_macro --all-features

      - name: Run tests (gotcha_macro no default features)
        run: |
          cargo test -p gotcha_macro --no-default-features

      - name: Run tests (gotcha_core)
        run: |
          cargo test -p gotcha_core --all-features
          cargo test -p gotcha_core --no-default-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-features --workspace -- -D warnings

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
