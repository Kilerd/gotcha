[package]
name = "gotcha_macro"
description = "gotcha web framework macro"
version = "0.4.1"
edition = "2021"
license = "MIT"

# docs.rs builds with every feature, so the OpenAPI layer and the rest of the optional surface
# actually appear; `docsrs` turns on the per-item "requires feature X" badges.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
# `full` for `ItemFn` (`#[api]`), `extra-traits` for the `Debug` derives on the parsed options.
syn = { version = "2.0.15", features = ["full", "extra-traits"] }
quote = "1.0.18"
proc-macro2 = "1.0.86"
darling = "0.23"
# serde's own attribute parser, so `#[serde(..)]` is read exactly as serde reads it.
serde_derive_internals = "0.29.1"
proc-macro-crate = "3"
